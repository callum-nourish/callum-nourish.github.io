name: Deploy to GitHub Pages

on:
  push:
    branches:
      - v4
    paths:
      - 'content/**'
      - 'docs/**'
      - 'quartz/**'
      - 'quartz.config.ts'
      - 'quartz.layout.ts'
      - 'public/static/**'
      - 'package-lock.json'
      - 'scripts/sync-confluence.mjs'
  schedule:
    # Weekdays: rebuild every 4 hours during the working day (07:00–19:00 UTC)
    - cron: '0 7,11,15,19 * * 1-5'
    # Weekends: single overnight rebuild to catch any Friday-evening Confluence edits
    - cron: '0 8 * * 0,6'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Full history for accurate last-modified dates
          filter: blob:none # Blobless clone: commit history without file contents

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Cache node_modules
        id: cache-nm
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-nm-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-nm.outputs.cache-hit != 'true'
        run: npm ci

      - name: Sync Confluence (fetch → cache)
        env:
          CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
          CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
        run: node scripts/sync-confluence.mjs

      - name: Build Confluence (cache → markdown)
        run: node scripts/build-confluence.mjs

      - name: Build Quartz
        run: npx quartz build

      - name: Disable Jekyll processing
        run: touch public/.nojekyll

      - name: Inject password hash into auth scripts
        env:
          SITE_PASSWORD: ${{ secrets.STATICRYPT_PASSWORD }}
        run: |
          # Hash the password with a fixed salt using the same algorithm as the browser
          HASH=$(echo -n "${SITE_PASSWORD}nourish-docs-2026" | sha256sum | cut -d' ' -f1)
          sed -i "s/PASSWORD_HASH_PLACEHOLDER/${HASH}/g" public/static/auth.js
          sed -i "s/PASSWORD_HASH_PLACEHOLDER/${HASH}/g" public/static/login.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
