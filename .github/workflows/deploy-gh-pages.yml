name: Deploy to GitHub Pages

on:
  push:
    branches:
      - v4
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for accurate last-modified dates

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Build Quartz
        run: npx quartz build

      - name: Password protect site
        env:
          STATICRYPT_PASSWORD: ${{ secrets.STATICRYPT_PASSWORD }}
        run: |
          npm install -g staticrypt
          # One shared salt per build — all pages must use the same salt so
          # the localStorage token from page 1 is valid on page 2+
          STATICRYPT_SALT=$(openssl rand -hex 16)
          # --remember 0.5 = 12 hours before re-prompting
          readarray -d '' HTML_FILES < <(find public -name "*.html" -print0)
          for file in "${HTML_FILES[@]}"; do
            staticrypt "$file" \
              --password "$STATICRYPT_PASSWORD" \
              --salt "$STATICRYPT_SALT" \
              --directory "$(dirname "$file")" \
              --remember 0.5 \
              --short
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
