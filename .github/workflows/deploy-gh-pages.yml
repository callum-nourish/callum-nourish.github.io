name: Deploy to GitHub Pages

on:
  push:
    branches:
      - v4
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for accurate last-modified dates

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Build Quartz
        run: npx quartz build

      - name: Inject password hash into auth scripts
        env:
          SITE_PASSWORD: ${{ secrets.STATICRYPT_PASSWORD }}
        run: |
          # Hash the password with a fixed salt using the same algorithm as the browser
          HASH=$(echo -n "${SITE_PASSWORD}nourish-docs-2026" | sha256sum | cut -d' ' -f1)
          sed -i "s/PASSWORD_HASH_PLACEHOLDER/${HASH}/g" public/static/auth.js
          sed -i "s/PASSWORD_HASH_PLACEHOLDER/${HASH}/g" public/static/login.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
